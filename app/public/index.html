<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator v1.1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 900px;">
    <h1 class="mb-4 text-center">Loan EMI Calculator</h1>

    <div class="row g-4">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Enter loan details</h5>
            <form id="emi-form" novalidate>
              <div class="mb-3">
                <label for="principal" class="form-label">Loan amount (P)</label>
                <input type="number" class="form-control" id="principal" min="1" step="any" placeholder="500000">
              </div>
              <div class="mb-3">
                <label for="rate" class="form-label">Annual interest rate (%)</label>
                <input type="number" class="form-control" id="rate" min="0.01" step="any" placeholder="12">
              </div>
              <div class="mb-3">
                <label for="months" class="form-label">Tenure (months)</label>
                <input type="number" class="form-control" id="months" min="1" step="1" placeholder="24">
              </div>
              <div id="form-error" class="alert alert-danger d-none py-2" role="alert"></div>
              <button type="submit" class="btn btn-primary w-100" id="calc-btn">Calculate EMI</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card shadow-sm" id="result-panel">
          <div class="card-body">
            <h5 class="card-title">Result</h5>
            <p class="text-muted mb-0" id="result-empty">No calculation yet.</p>
            <div id="result-content" class="d-none">
              <table class="table table-sm mb-2">
                <tbody>
                  <tr><th>Monthly EMI</th><td id="r-emi"></td></tr>
                  <tr><th>Total payment</th><td id="r-total"></td></tr>
                  <tr><th>Total interest</th><td id="r-interest"></td></tr>
                  <tr><th>Served by pod</th><td id="r-pod"></td></tr>
                  <tr><th>Pod IP</th><td id="r-ip"></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h5 class="card-title">Last 10 calculations</h5>
        <div class="table-responsive">
          <table class="table table-striped table-sm align-middle mb-0" id="history-table">
            <thead>
              <tr>
                <th>Time</th><th>Principal</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Served by</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <tr><td colspan="6" class="text-muted">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
